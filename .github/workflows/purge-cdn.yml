# Purge jsDelivr CDN Cache
# Purges and verifies the cached CSS/JS whenever they change on main.
#
# The verification is a real gate: it hashes the whole file and fails the run
# if the CDN is not serving it. See scripts/purge-cdn.sh for why (tncld#30) —
# the previous version hashed only `head -20`, a static comment banner, so it
# reported success while the CDN served stale assets.

name: Purge jsDelivr Cache

on:
  push:
    branches: [main]
    paths:
      - 'header.css'
      - 'footer.js'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Purge and verify jsDelivr cache
        run: bash scripts/purge-cdn.sh header.css footer.js
