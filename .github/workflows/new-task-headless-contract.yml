name: new-task-headless-contract

# CI gate for new-task.sh's headless-safety behaviour — brik-llm#2963 (from #2812).
#
# new-task.sh's warn-then-continue prompts must not block or abort when stdin is
# closed or NEW_TASK_YES=1. `read` returns 1 on EOF and the script runs under
# `set -euo pipefail`, so a bare `read -r` at a prompt kills the script before the
# worktree exists — the #2812 defect, which reached this repo as tncld#161.
#
# This copy already satisfies the contract; the gate is what keeps it satisfied.
# It was left ungated until brik-llm#3055 because the canonical test passed
# `--over-budget`, a flag only brik-llm and the three originally-gated copies
# carry, so the run died at flag parsing and read as a contract failure it never
# had.
#
# test-new-task-headless.sh is a BYTE-IDENTICAL fleet twin, canonical in brik-llm
# and synced here (see the file header). It is the one part of new-task.sh's
# behaviour identical enough across every repo to be a twin: it drives THIS repo's
# own new-task.sh + libs headless past the branch-reuse prompt to worktree
# creation, so it holds whatever confirm mechanism and prompt order this copy
# uses. The rest of new-task.sh is a legitimate per-repo fork (base branch, gate
# libs, strings, order) that ADR-028 §7 keeps copied.
#
# NEVER fix the test or identity-guard.sh here. Fix them in brik-llm and re-sync;
# a local edit is DRIFT to overlap-twin-drift, not an improvement (brik-llm#3055).
#
# Gate budget: one new path-scoped workflow (~seconds; a bash suite plus one
# shellcheck), triggered only when new-task.sh, its libs, the test, or this file
# change. Mirrors the byte-identical workflow brikdesigns already runs, so this
# adds no new gate SHAPE to the fleet — only this repo's copy of an existing one.

on:
  pull_request:
    paths:
      - 'scripts/new-task.sh'
      - 'scripts/test/test-new-task-headless.sh'
      - 'scripts/lib/identity-guard.sh'
      - '.github/workflows/new-task-headless-contract.yml'

concurrency:
  group: new-task-headless-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  new-task-headless-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: new-task.sh's prompts are headless-safe
        run: bash scripts/test/test-new-task-headless.sh < /dev/null

      - name: shellcheck new-task.sh + the headless test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # --severity=warning: new-task.sh predates this gate and carries SC1091
          # (unfollowed `source`, unavoidable here) plus style notes.
          shellcheck --severity=warning \
                     scripts/new-task.sh \
                     scripts/test/test-new-task-headless.sh
